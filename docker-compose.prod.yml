services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No `ports:` — unlike docker-compose.dev.yml, PostgreSQL is not published to
    # the host in production. Only the backend service (below) can reach it, over
    # the Compose network, by service name.
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      # $$ (not $) escapes Compose's own interpolation, so this is expanded by the
      # shell *inside* the postgres container against its own environment at
      # healthcheck time — same reasoning as docker-compose.dev.yml.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      target: production
    env_file:
      - .env.prod
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      postgres:
        # Waits for the postgres healthcheck above, not just for the postgres
        # container to have started — same reasoning as docker-compose.dev.yml.
        condition: service_healthy
    # No bind mounts here, deliberately: the production image is meant to run
    # exactly what was built into it (Issue #42's "build" stage output), not a
    # live view of the host's source tree, and there is no hot reload to support.
    # No `command:` override either — the production Dockerfile stage's own CMD
    # (`npm run start:container`, i.e. the compiled dist/main/migrate.js, then
    # dist/main/server.js) already runs migrations before the server starts, and
    # already runs as the image's non-root `app` user (Issue #42).
    restart: unless-stopped

volumes:
  postgres_data_prod:
