services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Published for local tools (DBeaver) — this is the dev-only convenience;
      # the prod compose file (Issue #45) must not publish this port.
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      # $$ (not $) escapes Compose's own interpolation, so this is expanded by
      # the shell *inside* the postgres container against its own environment
      # at healthcheck time, not baked in as a static string at `up` time.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      target: development
    env_file:
      - .env.dev
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        # Waits for the postgres healthcheck above, not just for the postgres
        # container to have started — plain `depends_on` only guarantees the
        # latter, which is not the same as PostgreSQL being ready to accept
        # connections.
        condition: service_healthy
    volumes:
      # Bind-mounts the repo over /app for hot reload...
      - .:/app
      # ...then this second, more specific mount shadows just /app/node_modules
      # with a named volume, so the host's node_modules (if any, and possibly
      # built for the wrong OS/arch) never overwrites the image's own
      # container-native node_modules underneath the bind mount.
      - backend_node_modules:/app/node_modules
    # The development Dockerfile stage's own CMD is bare `npm run dev` — it
    # does not run migrations. This override runs the source-based migration
    # runner first (db:migrate:dev, via ts-node — the compiled dist/main/migrate.js
    # doesn't exist in this stage, since "development" never runs `npm run build`),
    # then hands off to the hot-reload dev server — via `dev:docker`, not plain
    # `dev`: ts-node-dev's file watcher (chokidar) only receives native filesystem
    # change events with its default settings, and those don't reliably cross a
    # Docker Desktop bind mount (confirmed by verification: edits to a bind-mounted
    # file never triggered a respawn). `dev:docker` adds chokidar's `--poll` mode,
    # which works over a bind mount at the cost of some extra CPU from periodic
    # polling — scoped to this Docker path only; plain `npm run dev` (outside
    # Docker, native filesystem) is untouched and still uses native watching.
    command: sh -c "npm run db:migrate:dev && npm run dev:docker"

  python-consumer:
    build:
      context: ./python-rule-service
      target: development
    env_file:
      # Loads python-rule-service/.env.dev — deliberately its own file, not
      # the root .env.dev: the two services are independently configured
      # (see the root README's "Project 7" section), and the Node backend's
      # env_file above is never shared with this service. DATABASE_URI inside
      # that file points at host "postgres" (this Compose network's Postgres
      # service name), and CLOUDAMQP_URL points at the same hosted RabbitMQ
      # instance the Node backend publishes to — there is no local RabbitMQ
      # container here or anywhere else in this Compose file.
      - python-rule-service/.env.dev
    depends_on:
      postgres:
        # Same reasoning as the backend service above: waits for Postgres to
        # actually accept connections, not just for its container to start.
        condition: service_healthy
    volumes:
      # Bind-mounts the service over /app for hot code visibility. Unlike the
      # backend's node_modules above, no shadowing named volume is needed
      # here: pip installs into the image's system site-packages (not into
      # /app), so the bind mount never overwrites installed dependencies.
      - ./python-rule-service:/app
    # No hot-reload/auto-restart tool: see python-rule-service/README.md's
    # "Docker development hot reload" section for why (in short: the file
    # watcher problem Node's --poll addresses is well understood, but Python's
    # only options carry the same platform reliability risk without the
    # `dev:docker` workaround's history of testing — restart manually instead:
    # `npm run dev:restart:python`).
    command: python -m src.main

volumes:
  postgres_data_dev:
  backend_node_modules:
